<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Job Atlas">
  <defs>
    <linearGradient id="ja-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD75B"/>
      <stop offset="55%" stop-color="#F5B90E"/>
      <stop offset="100%" stop-color="#C79A3B"/>
    </linearGradient>
    <linearGradient id="ja-jletter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A22B0"/>
      <stop offset="100%" stop-color="#1A0F5C"/>
    </linearGradient>
    <filter id="ja-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded background (transparent-ish cream for favicon safety) -->
  <rect width="512" height="512" rx="96" ry="96" fill="#FAF9F6"/>

  <!-- Premium 5-point star (gold gradient with darker gold rim) -->
  <g filter="url(#ja-shadow)">
    <path d="M 256 36
             L 320.6 167
             L 465.3 188
             L 360.6 290
             L 385.3 434
             L 256 366
             L 126.7 434
             L 151.4 290
             L 46.7 188
             L 191.4 167 Z"
          fill="url(#ja-star)"
          stroke="#8A6510"
          stroke-width="6"
          stroke-linejoin="round"/>
    <!-- Inner subtle highlight facet on star (top-left) -->
    <path d="M 256 36 L 320.6 167 L 256 190 L 191.4 167 Z"
          fill="#FFE79A" opacity="0.55"/>
  </g>

  <!-- Bold serif J centered inside the star -->
  <g stroke="url(#ja-jletter)"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">
    <!-- Top serif bar -->
    <line x1="206" y1="176" x2="318" y2="176" stroke-width="34"/>
    <!-- Vertical stem + bottom hook -->
    <path d="M 275 176 L 275 296 Q 275 342 231 342 Q 188 342 188 300"
          stroke-width="34"/>
  </g>

  <!-- Tiny sparkle accent (top-right of star) for premium feel -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="360" cy="120" r="4"/>
    <circle cx="380" cy="140" r="2.5"/>
    <circle cx="345" cy="145" r="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Job Atlas">
  <defs>
    <linearGradient id="ja-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#122740"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>
    <linearGradient id="ja-j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F0C260"/>
      <stop offset="50%"  stop-color="#D8A73F"/>
      <stop offset="100%" stop-color="#8A6510"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark navy background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#ja-bg)"/>

  <!-- Elegant serif "J" wordmark. Drawn as a single filled path so it
       renders identically at any size (16px favicon → 512px app icon). -->
  <path d="
    M 128 110
    L 384 110
    Q 400 110 400 128
    L 400 152
    Q 400 170 384 170
    L 306 170
    L 306 336
    Q 306 402 250 402
    Q 176 402 138 342
    Q 132 332 142 326
    L 194 296
    Q 204 290 210 300
    Q 226 328 250 328
    Q 258 328 258 320
    L 258 170
    L 128 170
    Q 112 170 112 152
    L 112 128
    Q 112 110 128 110
    Z"
    fill="url(#ja-j)"/>

  <!-- Subtle drop-shadow accent line under the letter (adds premium depth) -->
  <path d="M 96 440 L 416 440" stroke="#C79A3B" stroke-width="2" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Job Atlas">
  <defs>
    <linearGradient id="ja-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F0C260"/>
      <stop offset="55%"  stop-color="#C79A3B"/>
      <stop offset="100%" stop-color="#8A6510"/>
    </linearGradient>
    <linearGradient id="ja-jletter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12293F"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>
    <filter id="ja-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Rounded cream background (matches Job Atlas cream #FAF9F6) -->
  <rect width="512" height="512" rx="88" ry="88" fill="#FAF9F6"/>

  <!-- Premium 5-point gold star (Geminista gold gradient with darker rim) -->
  <g filter="url(#ja-shadow)">
    <path d="M 256 40
             L 322 172
             L 466 193
             L 361 296
             L 386 440
             L 256 372
             L 126 440
             L 151 296
             L 46  193
             L 190 172 Z"
          fill="url(#ja-star)"
          stroke="#5F4408"
          stroke-width="5"
          stroke-linejoin="round"/>
    <!-- Subtle inner highlight facet (top wedge) -->
    <path d="M 256 40 L 322 172 L 256 188 L 190 172 Z"
          fill="#F7D98E" opacity="0.55"/>
  </g>

  <!-- Serif "J" centered inside the star, navy ink -->
  <g stroke="url(#ja-jletter)"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">
    <!-- Top serif bar -->
    <line x1="208" y1="180" x2="316" y2="180" stroke-width="34"/>
    <!-- Vertical stem + curved hook -->
    <path d="M 274 180 L 274 300 Q 274 344 232 344 Q 188 344 188 302"
          stroke-width="34"/>
  </g>

  <!-- Tiny sparkle detailing (top-right of star) -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="360" cy="122" r="4"/>
    <circle cx="380" cy="142" r="2.5"/>
    <circle cx="345" cy="146" r="2"/>
  </g>
</svg>

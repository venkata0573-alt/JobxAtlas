# .github/workflows/verify.yml — Phase 1d merge gate.
#
# Two parallel jobs:
#   * test     — boots the hermetic docker-compose test stack, seeds, runs
#                the backend suite + Playwright e2e. This is `make verify`
#                minus security-scan (security runs in its own job).
#   * security — gitleaks (hard gate), bandit / pip-audit / semgrep
#                (report-only artifacts).
#
# Both must pass for `verify` to be green. Merges to main are blocked on it
# via branch protection (see PROJECT_STATUS.md §7).
#
# The one placeholder `test-frontend` is deliberately NOT invoked here — it
# exit-1s with an "add Jest tests" message, and re-adding it to `verify`
# without real tests would just paint the ship red.

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One concurrent run per branch; a new push cancels an older in-flight run.
# Saves runner minutes and avoids a stale run overwriting a fresh one.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # test — the real functional gate
  # ==========================================================================
  test:
    name: Backend + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap .env.test
        run: cp .env.test.example .env.test

      # Build + boot the compose test stack. --wait blocks until every
      # container's healthcheck goes healthy or the timeout expires.
      - name: Boot test stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Seed personas
        run: make seed

      # ---- Fast pre-check: scanner invariants ---------------------------
      # These are cheap (< 5s) and catch policy-file drift early (someone
      # added a route without updating security/public_routes.yml, etc).
      # They also run inside `make test-backend` below — the duplication
      # is intentional for fast feedback.
      - name: Scanner invariants (fast pre-check)
        run: |
          docker compose -f docker-compose.test.yml exec -T \
            -e TEST_BACKEND_URL=https://localhost:8443 \
            backend python -m pytest -n 0 --no-cov -v \
              tests/test_public_surface.py \
              tests/test_csrf_surface.py \
              ../docs/scripts/tests/test_scanner.py

      # ---- Full backend suite ------------------------------------------
      - name: Backend suite
        run: make test-backend

      # ---- E2E prerequisites -------------------------------------------
      # Playwright browsers are installed on the HOST (not in the frontend
      # container) because REACT_APP_BACKEND_URL is baked as
      # https://localhost:18443 — that host is unreachable from inside the
      # container. See the make e2e comment.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps
        run: cd frontend && yarn install --frozen-lockfile --network-timeout 600000

      - name: Install Playwright browsers (chromium + OS deps)
        run: cd frontend && npx playwright install --with-deps chromium

      # ---- E2E suite ---------------------------------------------------
      - name: E2E suite
        run: make e2e

      # ---- Artifacts on failure ----------------------------------------
      # Playwright's HTML report has a per-spec trace + screenshot on
      # failure — the fastest way to diagnose a red run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

      # coverage.json is regenerated by `make coverage-gaps`. We don't run
      # coverage-gaps in CI (it restarts the backend container), but the
      # pytest --cov-report=json from make test-backend writes a partial
      # to docs/scripts/.artifacts/coverage.json. Upload it always so a
      # baseline is available for review.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: docs/scripts/.artifacts/coverage.json
          if-no-files-found: ignore
          retention-days: 14

      # Show what died — the most common source of a mystery-red run is
      # something in the backend log (a boot-time RuntimeError from config,
      # a Mongo timeout during seed, etc).
      - name: Backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs backend

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ==========================================================================
  # security — gitleaks is a hard gate; bandit/pip-audit/semgrep are
  # report-only until we've triaged their baseline noise.
  # ==========================================================================
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # gitleaks needs the full history to walk every commit, not just the
      # shallow checkout default.
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Pinned versions so the CI baseline is reproducible. Bump deliberately.
      - name: Install security tools
        run: pip install bandit==1.7.10 pip-audit==2.7.3 semgrep==1.85.0

      # ---- gitleaks — HARD GATE ----------------------------------------
      # Any finding fails the build. gitleaks-action installs the binary
      # and runs `gitleaks detect` on the checked-out tree + history.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- report-only scans -------------------------------------------
      # continue-on-error: findings are archived as JSON artifacts and
      # surfaced in job output, but they don't fail the build until we've
      # triaged the baseline. Flipping these to hard gates is a separate
      # follow-up (Phase 1d.1 or per-tool as each ruleset gets triaged).

      - name: bandit (report-only, medium+high)
        continue-on-error: true
        run: |
          bandit -r backend/ -ll -f screen | tee bandit-report.txt
          bandit -r backend/ -ll -f json -o bandit-report.json || true

      - name: pip-audit (report-only)
        continue-on-error: true
        run: |
          pip-audit --requirement backend/requirements.txt | tee pip-audit-report.txt
          pip-audit --requirement backend/requirements.txt \
            --format json --output pip-audit-report.json || true

      - name: semgrep (report-only, OWASP top-ten + python)
        continue-on-error: true
        run: |
          semgrep --config p/owasp-top-ten --config p/python backend/ \
            | tee semgrep-report.txt
          semgrep --config p/owasp-top-ten --config p/python \
            --json --output semgrep-report.json backend/ || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            bandit-report.txt
            bandit-report.json
            pip-audit-report.txt
            pip-audit-report.json
            semgrep-report.txt
            semgrep-report.json
          if-no-files-found: warn
          retention-days: 14

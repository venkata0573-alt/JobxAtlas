[pytest]
# Fixed 2 xdist workers (deterministic, not reliant on the agent passing -n). loadscope pins each test
# class/module to one worker — generated suites share one preview backend and assume sequential shared
# state — so it parallelizes across classes/modules without cross-test races.
# AGENT: do NOT modify addopts; keep exactly -n 2 --dist loadscope and run only what is configured here.
# Serial = `-n 0` (NOT `-p no:xdist`, which errors because addopts still passes -n/--dist). A custom `-n`
# option in your own pytest setup collides with xdist's -n — rename it.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope

# asyncio_mode=auto so tests defined as `async def test_...` are picked up
# without an explicit `@pytest.mark.asyncio` marker — someone will forget one
# otherwise and get a silently-skipped test. Requires pytest-asyncio (test
# image only; see backend/Dockerfile.test).
asyncio_mode = auto
# Session-scoped event loop for BOTH tests and fixtures. Motor's
# AsyncIOMotorClient binds to whatever loop is current at first use; a fresh
# per-test loop (the pytest-asyncio default) closes Motor's loop after test 1
# and every later test dies with "Event loop is closed". Pinning both scopes
# to session keeps one loop across the whole run.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
